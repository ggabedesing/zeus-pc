<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Zeus PC</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
    .notfound .code{font-size:96px;font-weight:900;letter-spacing:-.06em;color:var(--accent);line-height:1}
    .notfound h1{font-size:28px;margin:12px 0 8px;letter-spacing:-.03em}
    .notfound p{color:var(--muted);max-width:420px;line-height:1.7;margin:0 0 26px}
    .notfound a{display:inline-block;text-decoration:none}
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <div class="code">404</div>
      <h1>Esta página não existe.</h1>
      <p>O Zeus só serve a interface local em <code>127.0.0.1</code>. O endereço pode ter mudado ou foi digitado com erro.</p>
      <a class="primary-btn" href="/">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
